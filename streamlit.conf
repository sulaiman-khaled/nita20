# /etc/apache2/sites-available/streamlit.conf
# Reverse-proxy: public port 80  ->  Streamlit on 127.0.0.1:8501
# Requires:  sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers

<VirtualHost *:80>
    ServerAdmin admin@nita20.local
    ServerName  ec2-54-159-23-157.compute-1.amazonaws.com

    ProxyPreserveHost On
    ProxyRequests Off

    # Streamlit uses WebSockets on /_stcore/stream - route them first
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:8501/$1 [P,L]

    # All normal HTTP traffic
    ProxyPass        / http://127.0.0.1:8501/
    ProxyPassReverse / http://127.0.0.1:8501/

    # Basic hardening
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog  ${APACHE_LOG_DIR}/streamlit_error.log
    CustomLog ${APACHE_LOG_DIR}/streamlit_access.log combined
</VirtualHost>
